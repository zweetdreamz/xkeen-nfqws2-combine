# Tooling configuration only: the project is a set of router scripts, not an
# installable Python package.

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-p no:cacheprovider"
pythonpath = ["tools/router"]

[tool.coverage.run]
branch = true
source = ["tools"]
omit = ["tests/test_*.py", "tests/panel_*.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true
precision = 1
