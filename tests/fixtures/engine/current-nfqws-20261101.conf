# Sanitized effective argument capture 2026-11-01. No policy/interface/private data.
# Strategies and global blob declaration IDs retained; lists populated by test.
ISP_INTERFACE=eth3
NFQUEUE_NUM=300
USER=nobody
LOG_LEVEL=0
NFQWS_BASE_ARGS="--lua-init=@/opt/etc/nfqws2/lua/zapret-lib.lua
--lua-init=@/opt/etc/nfqws2/lua/zapret-antidpi.lua
--lua-init=@/opt/etc/nfqws2/lua/zapret-auto.lua
--blob=quic_initial:@/opt/etc/nfqws2/blobs/quic_initial.bin
--blob=tls_clienthello:@/opt/etc/nfqws2/blobs/tls_clienthello.bin
--blob=discord_udp:@/opt/etc/nfqws2/blobs/discord_udp.bin
--blob=youtube_quic:@/opt/etc/nfqws2/blobs/quic_initial.bin"
NFQWS_ARGS="--filter-tcp=443
--filter-l7=tls
--hostlist=/opt/etc/nfqws2/lists/user.list
--out-range=-d10
--payload=tls_client_hello
--lua-desync=fake:blob=fake_default_tls:tls_mod=rnd,dupsid,sni=www.google.com:tcp_ts=-600000
--lua-desync=multisplit:pos=1,midsld:seqovl=1:seqovl_pattern=tls_clienthello:tcp_ts_up"
NFQWS_ARGS_UDP="--filter-udp=443,3478-3481,5349,19294-19344,50000-50100
--filter-l7=stun,discord
--out-range=<n4
--payload=stun,discord_ip_discovery
--lua-desync=fake:blob=discord_udp:repeats=2"
NFQWS_ARGS_QUIC="--filter-udp=443 --filter-l7=quic
--payload=quic_initial
--lua-desync=fake:blob=quic_initial:repeats=11"
NFQWS_EXTRA_ARGS="--hostlist=/opt/etc/nfqws2/lists/user.list"
NFQWS_ARGS_IPSET=""
NFQWS_ARGS_CUSTOM="--filter-tcp=443
--filter-l7=tls
--hostlist=/opt/etc/nfqws2/lists/youtube.list
--out-range=-d10
--payload=tls_client_hello
--lua-desync=fake:blob=tls_clienthello:tls_mod=rnd,dupsid,sni=fonts.google.com:tcp_seq=10000
--lua-desync=multisplit:pos=1,midsld:seqovl=5:seqovl_pattern=tls_clienthello:tcp_ts_up
--new
--filter-udp=443
--filter-l7=quic
--hostlist=/opt/etc/nfqws2/lists/youtube.list
--payload=quic_initial
--lua-desync=fake:blob=youtube_quic:repeats=11"
TCP_PORTS="443"
UDP_PORTS="443,3478:3481,5349,19294:19344,50000:50100"
