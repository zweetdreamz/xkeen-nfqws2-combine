name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.shell }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # dash is a strict POSIX sh; busybox ash is what Entware runs on the router.
        shell: ["dash", "busybox sh"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y busybox jq
          python -m pip install --upgrade pytest coverage
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Run all test suites
        env:
          TEST_SHELL: ${{ matrix.shell }}
          TEST_BUSYBOX_APPLETS: ${{ matrix.shell == 'busybox sh' && '1' || '0' }}
          REQUIRE_PANEL_UI_TESTS: "1"
        run: sh tests/run-all.sh --coverage

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          find . -name '*.sh' -not -path './.git/*' -print0 |
            xargs -0 shellcheck -S warning
      - name: ruff (pyflakes and bugbear)
        run: |
          python3 -m pip install ruff
          ruff check --select F,B,E9 tools tests
